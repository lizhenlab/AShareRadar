name: Security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit-and-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      TZ: UTC

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-dev-lock.txt

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install locked audit tooling
        run: |
          python -m pip install --require-hashes -r requirements-dev-lock.txt
          python -m pip check
          npm ci --ignore-scripts

      - name: Audit locked Python runtime dependencies
        run: >-
          python -m pip_audit
          --require-hashes
          --disable-pip
          --strict
          --progress-spinner off
          --requirement requirements-lock.txt

      - name: Audit locked Python development dependencies
        run: >-
          python -m pip_audit
          --require-hashes
          --disable-pip
          --strict
          --progress-spinner off
          --requirement requirements-dev-lock.txt

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Generate reproducible CycloneDX SBOMs
        run: |
          python tools/generate_sbom.py --output-dir "$RUNNER_TEMP/sbom-a"
          python tools/generate_sbom.py --output-dir "$RUNNER_TEMP/sbom-b"
          diff --recursive --unified "$RUNNER_TEMP/sbom-a" "$RUNNER_TEMP/sbom-b"

      - name: Upload CycloneDX SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cyclonedx-sbom
          path: ${{ runner.temp }}/sbom-a/*.cdx.json
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-verified Gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan current source with redacted output
        run: >-
          "$RUNNER_TEMP/gitleaks" dir
          --no-banner
          --no-color
          --redact=100
          --timeout=120
          .

      - name: Scan complete Git history with redacted output
        run: >-
          "$RUNNER_TEMP/gitleaks" git
          --no-banner
          --no-color
          --redact=100
          --timeout=120
          --log-opts=--all
          .
