[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 160

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "C90"]
ignore = ["B008", "B009"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]
"app/services/provider_registry.py" = ["E402"]
"tests/*" = ["C901"]

